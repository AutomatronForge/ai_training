services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    # Pull the coach model on first start, then run the server (CPU inference).
    entrypoint: >
      bash -c "ollama serve & sleep 5 && ollama pull llama3.2:3b && wait"

  mario-train-cpu:
    build:
      context: ../../train
      dockerfile: ../docker/cpu/Dockerfile
    container_name: cpu-mario-train
    depends_on:
      - ollama
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=ollama
    volumes:
      # Separate config + models dir so this run is fully independent of the GPU run.
      - ../../train/config_cpu.py:/app/config.py
      - ../../../../models_cpu:/app/models
      - ../../train/entrypoint.py:/app/entrypoint.py
      - ../../train/train.py:/app/train.py
      - ../../train/train_v0.py:/app/train_v0.py
      - ../../train/train_v3.py:/app/train_v3.py
      - ../../train/train_ram.py:/app/train_ram.py
      - ../../train/env_utils.py:/app/env_utils.py
      - ../../train/env_utils_ram.py:/app/env_utils_ram.py
      - ../../train/ollama_coach.py:/app/ollama_coach.py
      - ../../train/viewer.py:/app/viewer.py
      - ../../train/download_pretrained.py:/app/download_pretrained.py
      - ./tensorboard:/app/tensorboard
    ports:
      # Distinct host ports so it never clashes with the GPU run (8080/6006)
      # or the showcase (8081).
      - "8082:8080"
      - "6008:6006"
    shm_size: '2gb'
    command: >
      bash -c "tensorboard --logdir /app/tensorboard --host 0.0.0.0 --port 6006 &
               python entrypoint.py"

volumes:
  ollama-models:

