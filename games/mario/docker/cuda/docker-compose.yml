services:
  ollama:
    image: ollama/ollama:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ollama-models:/root/.ollama
    # Pull the coach model on first start, then run the server.
    entrypoint: >
      bash -c "ollama serve & sleep 5 && ollama pull llama3.2:3b && wait"

  mario-train:
    build:
      context: ../../train
      dockerfile: ../docker/cuda/Dockerfile
    runtime: nvidia
    depends_on:
      - ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_HOST=ollama
    volumes:
      - ../../../../models:/app/models
      - ../../train/config.py:/app/config.py
      - ../../train/entrypoint.py:/app/entrypoint.py
      - ../../train/train.py:/app/train.py
      - ../../train/train_v0.py:/app/train_v0.py
      - ../../train/train_v3.py:/app/train_v3.py
      - ../../train/train_ram.py:/app/train_ram.py
      - ../../train/env_utils.py:/app/env_utils.py
      - ../../train/env_utils_ram.py:/app/env_utils_ram.py
      - ../../train/ollama_coach.py:/app/ollama_coach.py
      - ../../train/viewer.py:/app/viewer.py
      - ../../train/metrics_db.py:/app/metrics_db.py
      - ../../train/impala_cnn.py:/app/impala_cnn.py
      - ../../train/download_pretrained.py:/app/download_pretrained.py
      - ./tensorboard:/app/tensorboard
      - ./metrics:/app/metrics
    ports:
      - "8080:8080"
      - "6006:6006"
    shm_size: '8gb'
    command: >
      bash -c "tensorboard --logdir /app/tensorboard --host 0.0.0.0 --port 6006 &
               python entrypoint.py"

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - mario-train
    environment:
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DATE_FORMATS_DEFAULT_TIMEZONE=Asia/Manila
      - TZ=Asia/Manila
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./metrics:/app/metrics
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  ollama-models:
  grafana-data:
