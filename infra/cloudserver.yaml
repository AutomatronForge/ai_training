AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Base training instance for the Test AI project for learning (ai_training).

# ---------------------------------------------------------------------------
# Parameters — supply these at deploy time. Fill in the TODOs / your details.
# ---------------------------------------------------------------------------
Parameters:
  InstanceType:
    Type: String
    Default: g4dn.2xlarge
    AllowedValues:
      - g4dn.xlarge
      - g4dn.2xlarge
      - g5.xlarge
      - g5.2xlarge
      - g5.4xlarge
      - g5.8xlarge
      - c7i.2xlarge
      - c7i.4xlarge
      - c8i.8xlarge
    Description: >
      Instance type. GPU for pixel/CNN training (default DL GPU AMI):
      g4dn.* = NVIDIA T4 (16GB); g5.* = NVIDIA A10G (24GB, faster/newer), all
      single-GPU, differing only in vCPU/RAM — which matters most here because
      NES env-stepping is CPU-bound (pick N_ENVS ~= vCPU count):
      g5.xlarge=4 vCPU/16GB (~$1.01/hr, N_ENVS~4), g5.2xlarge=8 vCPU/32GB
      (~$1.21/hr, N_ENVS~8), g5.4xlarge=16 vCPU/64GB (~$1.62/hr, N_ENVS~16),
      g5.8xlarge=32 vCPU/128GB (~$2.45/hr, N_ENVS~30). CPU-optimized (c7i/c8i.*)
      for RAM/MLP training (GPU sits idle): c7i.2xlarge=8 vCPU, c7i.4xlarge=16
      vCPU, c8i.8xlarge=32 vCPU. For any CPU type, set AmiChoice to cpu-ubuntu2404.

  # AMI selection as a friendly dropdown. A plain String with AllowedValues
  # renders as a proper dropdown in the console (an SSM-typed parameter does
  # not). The label maps to an SSM public parameter path via AmiPathMap, and
  # the instance resolves it with a {{resolve:ssm:...}} dynamic reference.
  AmiChoice:
    Type: String
    Default: gpu-dl-ubuntu2204
    AllowedValues:
      - gpu-dl-ubuntu2204     # Deep Learning base GPU AMI — for g4dn.* GPU instances.
      - cpu-ubuntu2404        # Ubuntu 24.04 LTS (HVM), SSD gp3 — for CPU instances.
    Description: >
      AMI to launch. gpu-dl-ubuntu2204 = DL GPU AMI (use with g4dn.*).
      cpu-ubuntu2404 = Ubuntu 24.04 LTS gp3 (use with c7i/c8i.*).

  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-059cc5d1eac25a351
    Description: VPC to launch into.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0c7d53686c2a09c07
    Description: Public subnet (needs outbound internet for pip/git).

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Default: sg-06777192d0a3e6f4f
    Description: Existing security group to attach to the instance.

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: ai-test
    Description: EC2 key pair for SSH access.

  RootVolumeSize:
    Type: Number
    Default: 100
    Description: Root EBS volume size in GiB (DL AMI base is large).

  RoleTypeTag:
    Type: String
    Default: netadm
    Description: RoleType tag value (required by policy).

# ---------------------------------------------------------------------------
# Mappings — AMI choice label -> SSM public parameter path.
# ---------------------------------------------------------------------------
Mappings:
  AmiPathMap:
    gpu-dl-ubuntu2204:
      SsmPath: /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-22.04/latest/ami-id
    cpu-ubuntu2404:
      SsmPath: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:
  # Launch template carries the IMDSv2 metadata options (not settable
  # directly on AWS::EC2::Instance). No explicit name — CFN auto-generates a
  # unique one so redeploys don't collide with a leftover template.
  InstanceLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required # IMDSv2 required (no IMDSv1)
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 2

  TrainingInstance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref InstanceLaunchTemplate
        Version: !GetAtt InstanceLaunchTemplate.LatestVersionNumber
      IamInstanceProfile: cloudserver-profile
      InstanceType: !Ref InstanceType
      ImageId: !Sub
        - "{{resolve:ssm:${Path}}}"
        - Path: !FindInMap [AmiPathMap, !Ref AmiChoice, SsmPath]
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroupId
      KeyName: !Ref KeyPairName
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: cloudserver
        - Key: RoleType
          Value: !Ref RoleTypeTag
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/userdata.log | logger -t userdata -s 2>/dev/console) 2>&1

          # --- Project setup (runs as ubuntu, matches setup_ec2.sh paths) ---
          sudo -iu ubuntu bash -c '
            curl -fsSL https://raw.githubusercontent.com/AutomatronForge/ai_training/main/setup_ec2.sh | bash
          '

Outputs:
  InstanceId:
    Description: EC2 instance id.
    Value: !Ref TrainingInstance
