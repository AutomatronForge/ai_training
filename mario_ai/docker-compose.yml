services:
  mario-train:
    build: .
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ../models:/app/models
      - ./tensorboard:/app/tensorboard
    ports:
      - "8080:8080"
      - "6006:6006"
    shm_size: '8gb'
    command: >
      bash -c "tensorboard --logdir /app/tensorboard --host 0.0.0.0 --port 6006 &
               python train.py"
